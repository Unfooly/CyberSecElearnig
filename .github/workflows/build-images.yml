name: build-images

# Obrazy api i web budujemy tutaj, NIE na VPS (1 GB RAM: `next build` kończy się
# tam SIGKILL/OOM). VPS tylko pobiera gotowe obrazy z GHCR - patrz docs/deploy-test.md.
# Obrazy trafiają do GHCR wyłącznie po zielonych testach (joby `test` i `e2e`).
#
# Ten sam workflow pełni dwie role:
#  - SPRAWDZENIA (`test` = "lint + testy" z typami web i testami hooków, `e2e` = "testy e2e (api)") biegną na KAŻDYM pull requeście do
#    main oraz na pushu do main. PR bez zielonych sprawdzeń nie jest mergowany (CLAUDE.md, "Praca zespołowa"). Nazwy jobów są stałe:
#    to pod nie ustawia się wymagane sprawdzenia w ochronie gałęzi (po upgrade'ie planu, docs/backlog-issues.md B-010).
#  - BUDOWA I PUBLIKACJA OBRAZÓW (`images`, `cleanup`) tylko z gałęzi main (push albo ręczne uruchomienie na main), NIGDY na pull
#    requeście ani z ręcznego uruchomienia z innej gałęzi: PR nie buduje obrazów, nie loguje się do GHCR i nie pushuje niczego.
#    NIE dodawać wyzwalacza `pull_request_target` (dawałby kodowi z PR uprawnienia i sekrety repozytorium).

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  # Bez paths-ignore: PR zmieniający tylko dokumenty też musi mieć zielone (raportowane) sprawdzenia, inaczej wymagane sprawdzenie
  # zostałoby na zawsze "oczekujące" i zablokowało merge.
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: lint + testy
    runs-on: ubuntu-latest
    env:
      # Placeholder jak w apps/api/Dockerfile: `prisma generate` czyta schema.prisma
      # (env("DATABASE_URL")), ale nie łączy się z bazą.
      DATABASE_URL: postgresql://user:password@localhost:5432/db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # postinstall buduje też packages/shared i packages/content (potrzebne api i web).
      - run: npm ci

      - name: Prisma generate
        run: npx prisma generate --schema=apps/api/prisma/schema.prisma

      # Bez --fix (skrypt `npm run lint` w api go ma) - w CI błąd lintu ma
      # zatrzymać pipeline, a nie zostać po cichu poprawiony.
      - name: Lint api
        working-directory: apps/api
        run: npx eslint "{src,test}/**/*.ts"

      - name: Testy jednostkowe api
        working-directory: apps/api
        run: npx jest

      # Schematy bloków, klasyfikacja pól client/secret i test mutacyjny wycieku klucza odpowiedzi.
      - name: Testy packages/content
        run: npm run test --workspace=packages/content

      # Narzędzia autora treści (audio narracji, zasoby modułów): OSOBNY projekt npm poza workspace'ami (SDK S3 i klucze nie trafiają do
      # lockfile'a aplikacji ani do obrazów). Testy są offline: ElevenLabs i S3/R2 za interfejsami, w CI zero wywołań sieciowych i zero kluczy.
      # Potok ładuje packages/content/dist (parseModule, klasyfikacja pól): budowa jawnie tu, żeby krok nie zależał od postinstall.
      - name: Testy scripts/content
        run: |
          npm run build --workspace=packages/content
          npm ci --prefix scripts/content
          npm run typecheck --prefix scripts/content
          npm test --prefix scripts/content

      - name: Lint web
        run: npm run lint --workspace=apps/web

      # Typy także w plikach testowych (vitest ich nie sprawdza, a `next build` nie obejmuje testów).
      - name: Typy web (tsc)
        run: npm run typecheck --workspace=apps/web

      - name: Testy web
        run: npm run test --workspace=apps/web

      - name: Testy skryptu czyszczenia GHCR
        run: node --test .github/scripts/select-versions-to-delete.test.js

      # Hook Claude Code egzekwujący regułę 7 (CLAUDE.md): przykłady blokowane i dozwolone.
      - name: Testy hooka block-file-writes (reguła 7)
        run: node --test .claude/hooks/block-file-writes.test.js

      # Lokalna blokada pushu na main (.githooks/pre-push) - do czasu ochrony gałęzi w GitHub (plan Team).
      - name: Testy hooka pre-push (blokada pushu na main)
        run: node --test .githooks/pre-push.test.js

      # Hook Claude Code egzekwujący regułę 11 (CLAUDE.md): polecenia niszczące na origin/main (force-push, reset --hard, ...).
      - name: Testy hooka block-destructive-git (reguła 11)
        run: node --test .claude/hooks/block-destructive-git.test.js

  # Testy e2e API na prawdziwym Postgresie i Redisie (kontenery serwisowe): m.in. izolacja
  # tenantów (RLS, Zasada nr 1), rejestracja, sesje, zadania w tle. Obrazy powstają dopiero
  # po zielonym `test` ORAZ `e2e`. Bez przeglądarkowego skryptu Playwright (wymaga
  # przeglądarek) - ten zostaje ręcznie (docs/e2e-registration.md).
  e2e:
    name: testy e2e (api)
    runs-on: ubuntu-latest
    # Lokalnie testy trwają ok. 1 min; limit łapie zawieszony uchwyt (BullMQ/ioredis) zamiast maskować go forceExit.
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cyberszkolo
          POSTGRES_PASSWORD: ci-migrator-password
          POSTGRES_DB: cyberszkolo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h localhost -U cyberszkolo -d cyberszkolo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Jak lokalnie (.env.test): migracje rolą właścicielem, runtime rolą cyberszkolo_app
      # (bez BYPASSRLS), żeby testy sprawdzały RLS w konfiguracji produkcyjnej.
      DATABASE_URL: postgresql://cyberszkolo:ci-migrator-password@localhost:5432/cyberszkolo_test?schema=public
      DATABASE_URL_APP: postgresql://cyberszkolo_app:ci-app-password@localhost:5432/cyberszkolo_test?schema=public&connection_limit=10
      REDIS_URL: redis://localhost:6379
      # Sekrety wyłącznie testowe, jednorazowe dla runnera.
      JWT_SECRET: ci-e2e-access-secret
      JWT_REFRESH_SECRET: ci-e2e-refresh-secret
      FRONTEND_URL: http://localhost:3000
      # Pusty token = tryb deweloperski EmailService (nic nie wychodzi na zewnątrz).
      MAILERSEND_API_TOKEN: ''
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Prisma generate
        run: npx prisma generate --schema=apps/api/prisma/schema.prisma

      # Ten sam skrypt co w docker/postgres-init (kontener serwisowy nie montuje katalogu init).
      - name: Rola runtime cyberszkolo_app
        env:
          PGHOST: localhost
          PGPASSWORD: ci-migrator-password
          POSTGRES_USER: cyberszkolo
          POSTGRES_DB: cyberszkolo_test
          # Skrypt wstawia hasło do SQL w apostrofach - hasło bez znaku ' (dotyczy też DATABASE_URL_APP wyżej).
          APP_DB_PASSWORD: ci-app-password
        run: sh docker/postgres-init/01-create-app-role.sh

      - name: Migracje (prisma migrate deploy)
        run: npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma

      - name: Testy e2e api
        working-directory: apps/api
        run: npx jest --config ./test/jest-e2e.json --runInBand

  images:
    name: obraz ${{ matrix.app }}
    needs: [test, e2e]
    # Tylko z gałęzi main (push albo ręczne uruchomienie NA main): nigdy na pull requeście ani z ręcznego uruchomienia z innej gałęzi
    # (bez budowy, bez logowania do GHCR, bez pushu).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v4

      # Nazwa wynika z właściciela repozytorium (github.repository_owner - konto
      # albo organizacja, np. Unfooly -> ghcr.io/unfooly/...) i nazwy repozytorium,
      # nic nie jest wpisane na sztywno. GHCR wymaga małych liter.
      - name: Nazwa obrazu
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          APP: ${{ matrix.app }}
        run: echo "name=ghcr.io/${OWNER,,}/${REPO,,}-${APP}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tagi
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      # Test dymny obrazu API PRZED publikacją: kontener musi rozwiązać wszystkie moduły aplikacji. Wyłapuje błędy, których
      # nie widzą testy na źródłach (np. zależność zagnieżdżona w apps/api/node_modules niedokopiowana do obrazu
      # => "Cannot find module 'sanitize-html'" przy starcie). Cache warstw jest współdzielony z krokiem push.
      - name: Test dymny obrazu (API)
        if: matrix.app == 'api'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          load: true
          push: false
          tags: smoke-api:ci
          provenance: false
          cache-from: type=gha,scope=api
      - name: Uruchom test dymny (require app.module)
        if: matrix.app == 'api'
        # Dodatkowo: natywny re2 (dopasowanie i walidacja regexów odpowiedzi, D-052) faktycznie się ładuje w obrazie i dopasowuje.
        run: >-
          docker run --rm --entrypoint node smoke-api:ci -e
          "require('./apps/api/dist/app.module'); const c = require('@cyberszkolo/content/dist/node'); if (!c.compileAnswerRegex('^(?:ab|cd)$').test('CD') || c.validateRegex('^(?=a)a$').length !== 1) process.exit(1)"

      - name: Build i push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Pojedynczy manifest (bez atestacji "unknown/unknown" w GHCR).
          provenance: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  # Limit GHCR na planie Free to ok. 500 MB dla prywatnych paczek - po udanym
  # pushu zostawiamy wersję z tagiem :latest i 3 najnowsze wersje z tagiem
  # sha-*, resztę (starsze sha-*, wersje bez tagów) usuwamy. Dla obu paczek.
  # Wybór wersji: .github/scripts/select-versions-to-delete.js (testowany).
  cleanup:
    name: sprzątanie ${{ matrix.app }}
    needs: images
    if: github.ref == 'refs/heads/main' && success()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v4

      - name: Usuń stare wersje obrazu
        uses: actions/github-script@v7
        env:
          APP: ${{ matrix.app }}
          KEEP_SHA_TAGS: '3'
        with:
          script: |
            const { selectVersionsToDelete } = require('./.github/scripts/select-versions-to-delete.js');
            const owner = context.repo.owner;
            const packageName = `${context.repo.repo}-${process.env.APP}`.toLowerCase();
            // Konto osobiste vs organizacja - inny prefiks endpointu.
            const scope = context.payload.repository.owner.type === 'Organization' ? 'orgs' : 'users';

            const versions = await github.paginate(
              `GET /${scope}/{owner}/packages/container/{package_name}/versions`,
              { owner, package_name: packageName, per_page: 100 },
            );
            const toDelete = selectVersionsToDelete(versions, { keepShaTags: Number(process.env.KEEP_SHA_TAGS) });
            core.info(`${packageName}: ${versions.length} wersji, do usunięcia: ${toDelete.length}`);

            for (const version of toDelete) {
              const tags = version.metadata?.container?.tags ?? [];
              core.info(`Usuwam wersję ${version.id} (${tags.join(', ') || 'bez tagów'}) z ${version.created_at}`);
              await github.request(
                `DELETE /${scope}/{owner}/packages/container/{package_name}/versions/{package_version_id}`,
                { owner, package_name: packageName, package_version_id: version.id },
              );
            }
