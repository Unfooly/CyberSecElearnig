# JEDYNYM źródłem konfiguracji na VPS jest plik `.env.prod` (wzór: .env.prod.example).
# Ten sam plik służy do dwóch rzeczy i MUSI być podany w obu:
#   1. interpolacji ${...} w tym pliku  -> flaga `--env-file .env.prod`,
#   2. zmiennych środowiskowych kontenerów -> `env_file: ${ENV_FILE:-.env.prod}` niżej.
# Dlatego każde polecenie: docker compose --env-file .env.prod -f docker-compose.prod.yml ...
# (albo raz w powłoce: export COMPOSE_ENV_FILES=.env.prod COMPOSE_FILE=docker-compose.prod.yml).
# Dev-owy `.env` NIE jest tu czytany przez kontenery. Brak flagi kończy się błędem
# "required variable POSTGRES_PASSWORD is missing" (celowo, patrz niżej).
# Lokalny stack (docker-compose.prodlocal.yml) wskazuje swój plik przez ENV_FILE.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cyberszkolo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Brak POSTGRES_PASSWORD - uruchom compose z --env-file .env.prod i ustaw go w .env.prod}
      POSTGRES_DB: cyberszkolo
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Brak APP_DB_PASSWORD - uruchom compose z --env-file .env.prod i ustaw go w .env.prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyberszkolo"]
      interval: 5s
      timeout: 5s
      retries: 5
    # Celowo BEZ "ports:" - baza nie jest wystawiona na zewnątrz,
    # dostępna tylko dla innych kontenerów w tej samej sieci Dockera.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Trwałość (AOF) i BRAK eviction: w Redisie leży m.in. unieważnienie sesji ("wyloguj wszędzie"
    # - klucz sessions-revoked:*) i limiter maili. Restart bez trwałości albo wyparcie klucza (LRU)
    # po cichu cofnęłoby unieważnienie access tokenów (guard jest wtedy fail-open). Przy zapełnieniu
    # (maxmemory) zapisy zwracają błąd zamiast kasować cudze klucze - aplikacja loguje incydent.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    # Też bez "ports:" - tylko wewnątrz sieci Dockera.

# Obrazy api i web NIE są budowane na VPS (1 GB RAM - `next build` kończy się OOM).
# Buduje je GitHub Actions (.github/workflows/build-images.yml) i wypycha do GHCR;
# tutaj tylko `docker compose pull`. Tag: IMAGE_TAG w .env.prod (domyślnie latest, do
# wycofania np. sha-1a2b3c4). Lokalny build do testów: docker-compose.prodlocal.yml.

  # Migracje Prisma jako OSOBNY, jednorazowy krok (nie w entrypoincie api):
  # uruchamia się przed api, kończy się kodem 0 i nie jest restartowany.
  # `prisma migrate deploy` bierze advisory lock w Postgresie, więc jest
  # bezpieczny nawet przy równoległym starcie. Używa TEGO SAMEGO obrazu co api;
  # DATABASE_URL to rola migracyjna z uprawnieniami DDL, a runtime api łączy się
  # osobną, ograniczoną przez RLS rolą z DATABASE_URL_APP.
  # UWAGA: `up -d --no-deps api` POMIJA ten krok - po `git pull` z nowymi
  # migracjami użyj `docker compose ... up -d` albo najpierw `run --rm migrate`.
  migrate:
    image: ${IMAGE_PREFIX:-ghcr.io/unfooly/cybersecelearnig}-api:${IMAGE_TAG:-latest}
    restart: "no"
    env_file: ${ENV_FILE:-.env.prod}
    entrypoint: []
    command: ["npx", "prisma", "migrate", "deploy", "--schema=apps/api/prisma/schema.prisma"]
    depends_on:
      postgres:
        condition: service_healthy

  # Import treści (content-import, D-051 pkt 11): jednorazowo, PO migrate, ale NIEZALEŻNIE od api (świadomie NIE ma go
  # w depends_on api) - import to TREŚĆ, nie SCHEMAT, więc jego awaria (np. uszkodzony module.json) ma być widoczna w
  # logach i kodzie wyjścia, a nie blokować (ani opóźniać) start API na produkcji. Po `docker compose up -d` sprawdź
  # `docker compose logs content-import` (patrz docs/deploy-test.md).
  content-import:
    image: ${IMAGE_PREFIX:-ghcr.io/unfooly/cybersecelearnig}-api:${IMAGE_TAG:-latest}
    restart: "no"
    env_file: ${ENV_FILE:-.env.prod}
    entrypoint: []
    command: ["node", "apps/api/dist/scripts/content-import.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    image: ${IMAGE_PREFIX:-ghcr.io/unfooly/cybersecelearnig}-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env.prod}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Bez "ports:" - api nie jest wystawione na zewnątrz. Przeglądarka rozmawia
    # wyłącznie z web (BFF), a web woła api przez wewnętrzną sieć compose.

  web:
    image: ${IMAGE_PREFIX:-ghcr.io/unfooly/cybersecelearnig}-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env.prod}
    depends_on:
      - api
    # Bez "ports:" - ruch z internetu wchodzi przez cloudflared (albo Caddy).

  # Cloudflare Tunnel: wychodzące połączenie z Cloudflare do tej sieci, więc
  # VPS nie wystawia żadnych portów (80/443 zamknięte), a TLS terminuje
  # Cloudflare. Ta sama (domyślna) sieć compose co web - w panelu Cloudflare
  # Zero Trust ustaw Public Hostname -> Service: http://web:3000.
  # Włączany profilem "tunnel" (COMPOSE_PROFILES=tunnel w .env.prod), żeby lokalny
  # stack (prodlocal) nie wymagał tokenu. Patrz docs/deploy-test.md.
  cloudflared:
    image: cloudflare/cloudflared:latest # na produkcji przypnij konkretną wersję
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      # Bez ":?" celowo - compose interpoluje cały plik także dla usług
      # wyłączonych profilem, a prodlocal nie ma tokenu. Pusty token kończy
      # się głośnym błędem cloudflared przy starcie.
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - web

  # Alternatywa dla tunelu: klasyczny reverse proxy z Let's Encrypt na
  # portach 80/443 (profil "caddy": COMPOSE_PROFILES=caddy). Nie łącz z tunelem.
  caddy:
    image: caddy:2-alpine
    profiles: ["caddy"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
