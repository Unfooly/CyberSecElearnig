services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cyberszkolo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ustaw POSTGRES_PASSWORD w .env}
      POSTGRES_DB: cyberszkolo
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Ustaw APP_DB_PASSWORD w .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyberszkolo"]
      interval: 5s
      timeout: 5s
      retries: 5
    # Celowo BEZ "ports:" - baza nie jest wystawiona na zewnątrz,
    # dostępna tylko dla innych kontenerów w tej samej sieci Dockera.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    # Też bez "ports:" - tylko wewnątrz sieci Dockera.

  # Migracje Prisma jako OSOBNY, jednorazowy krok (nie w entrypoincie api):
  # uruchamia się przed api, kończy się kodem 0 i nie jest restartowany.
  # `prisma migrate deploy` bierze advisory lock w Postgresie, więc jest
  # bezpieczny nawet przy równoległym starcie. Używa DATABASE_URL (rola
  # migracyjna z uprawnieniami DDL); runtime api łączy się osobną, ograniczoną
  # przez RLS rolą z DATABASE_URL_APP.
  # UWAGA: `up -d --no-deps api` POMIJA ten krok - po `git pull` z nowymi
  # migracjami użyj `docker compose ... up -d` albo najpierw `run --rm migrate`.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: "no"
    env_file: .env
    entrypoint: []
    command: ["npx", "prisma", "migrate", "deploy", "--schema=apps/api/prisma/schema.prisma"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Bez "ports:" - api nie jest wystawione na zewnątrz. Przeglądarka rozmawia
    # wyłącznie z web (BFF), a web woła api przez wewnętrzną sieć compose.

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      - api
    # Bez "ports:" - ruch z internetu wchodzi przez cloudflared (albo Caddy).

  # Cloudflare Tunnel: wychodzące połączenie z Cloudflare do tej sieci, więc
  # VPS nie wystawia żadnych portów (80/443 zamknięte), a TLS terminuje
  # Cloudflare. Ta sama (domyślna) sieć compose co web - w panelu Cloudflare
  # Zero Trust ustaw Public Hostname -> Service: http://web:3000.
  # Włączany profilem "tunnel" (COMPOSE_PROFILES=tunnel w .env), żeby lokalny
  # stack (prodlocal) nie wymagał tokenu. Patrz docs/deploy-test.md.
  cloudflared:
    image: cloudflare/cloudflared:latest # na produkcji przypnij konkretną wersję
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      # Bez ":?" celowo - compose interpoluje cały plik także dla usług
      # wyłączonych profilem, a prodlocal nie ma tokenu. Pusty token kończy
      # się głośnym błędem cloudflared przy starcie.
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - web

  # Alternatywa dla tunelu: klasyczny reverse proxy z Let's Encrypt na
  # portach 80/443 (profil "caddy": COMPOSE_PROFILES=caddy). Nie łącz z tunelem.
  caddy:
    image: caddy:2-alpine
    profiles: ["caddy"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
