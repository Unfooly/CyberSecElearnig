# Override do lokalnego testowania obrazów produkcyjnych w przeglądarce, BEZ
# Cloudflare/Caddy/TLS (bezpośrednie porty na hosta) i z env wskazującym na
# postgres/redis po nazwie usługi Dockera zamiast localhost.
#
# Tu (i tylko tu) obrazy są BUDOWANE lokalnie zamiast pobierane z GHCR - tagi
# `prodlocal-*` nie nadpisują obrazów z GHCR na tej maszynie.
#
# Konfiguracja: JEDEN plik, `.env.prodlocal.local` (gitignored, patrz .gitignore:
# .env.*.local). Podajemy go flagą --env-file (interpolacja), a ścieżkę do
# niego dla kontenerów niesie zmienna ENV_FILE zapisana w tym samym pliku
# (docker-compose.prod.yml: `env_file: ${ENV_FILE:-.env.prod}`).
# UWAGA: env_file z pliku nadrzędnego i override'u się SUMUJE (nie zastępuje),
# dlatego tu celowo NIE ma własnych `env_file` - inaczej kontenery czytałyby
# jednocześnie .env.prod i .env.prodlocal.local.
#
# Użycie:
#   docker compose -p prodlocal -f docker-compose.prod.yml -f docker-compose.prodlocal.yml --env-file .env.prodlocal.local up -d --build
#
# Wymaga w .env.prodlocal.local linii: ENV_FILE=.env.prodlocal.local
services:
  api:
    image: prodlocal-api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3001:3001"

  web:
    image: prodlocal-web
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"

  migrate:
    image: prodlocal-api
    build:
      context: .
      dockerfile: apps/api/Dockerfile

  content-import:
    image: prodlocal-api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
