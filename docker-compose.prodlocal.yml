# Override do lokalnego testowania obrazu produkcyjnego w przeglądarce, BEZ
# Caddy/TLS (bezpośrednie porty na hosta) i z env wskazującym na
# postgres/redis po nazwie usługi Dockera zamiast localhost.
#
# Użycie:
#   docker compose -p prodlocal -f docker-compose.prod.yml -f docker-compose.prodlocal.yml up -d --build
#
# Wymaga .env.prodlocal.local (gitignored, patrz .gitignore: .env.*.local).
services:
  api:
    env_file: .env.prodlocal.local
    ports:
      - "3001:3001"

  web:
    env_file: .env.prodlocal.local
    ports:
      - "3000:3000"

  migrate:
    env_file: .env.prodlocal.local
