services:
  # Dwie role Postgresa, celowo, nie przez pomyłkę:
  #   - POSTGRES_USER (cyberszkolo) - superuser tworzony przez obraz postgres,
  #     właściciel wszystkich tabel. Używany WYŁĄCZNIE przez `prisma migrate`
  #     (potrzebuje DDL). Superuser i właściciel tabel zawsze omijają RLS,
  #     nawet z FORCE ROW LEVEL SECURITY — więc ta rola NIE MOŻE być tą, którą
  #     łączy się backend w runtime.
  #   - cyberszkolo_app (docker/postgres-init/01-create-app-role.sh) - rola
  #     bez SUPERUSER/BYPASSRLS, którą backend (PrismaService) łączy się do
  #     bazy na co dzień. Tylko wtedy RLS (Zasada nr 1, CLAUDE.md) faktycznie
  #     ogranicza dostęp, jeśli kod zapomni filtra po organizationId.
  # Nie łącz tego z powrotem w jedną rolę — patrz README "Dwie role
  # Postgresa: migracje vs runtime".
  postgres:
    image: postgres:16-alpine
    container_name: cyberszkolo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cyberszkolo
      POSTGRES_PASSWORD: cyberszkolo_dev
      POSTGRES_DB: cyberszkolo
      # Przekazywane do docker-entrypoint-initdb.d, żeby stworzyć rolę
      # cyberszkolo_app z hasłem z .env (nigdy hardkodowanym) - patrz
      # .env.example.
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?ustaw APP_DB_PASSWORD w .env, patrz .env.example}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyberszkolo"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cyberszkolo-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
