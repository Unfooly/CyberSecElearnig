<script>
(() => {
  const T = 26;
  let tp = 0;
  const $ = id => document.getElementById(id);
  const clamp = x => Math.max(0, Math.min(1, x));
  const ease = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  const out = x => 1 - Math.pow(1 - x, 3);
  const seg = (t, a, b) => ease(clamp((t - a) / (b - a)));
  const win = (t, a, b, f = .4) => Math.min(seg(t, a, a + f), 1 - seg(t, b - f, b));
  const lerp = (a, b, k) => a + (b - a) * k;
  const op = (id, v) => $(id).setAttribute('opacity', v.toFixed(3));

  // subtle dot grid
  let d = '';
  for (let x = 40; x < 1920; x += 48) for (let y = 40; y < 1080; y += 48) d += `<circle cx="${x}" cy="${y}" r="1.6" fill="#E6E6E2"/>`;
  $('dots').innerHTML = d;
  let sc = '';
  for (let y = 0; y < 600; y += 8) sc += `<rect y="${y}" width="1000" height="3" fill="#FFFFFF" opacity=".05"/>`;
  $('scan').innerHTML = sc;

  // screen-space helpers: laptop screen origin 200,180
  const S = (x, y) => [200 + x, 180 + y];
  const path = [
    [0, S(760, 520)], [3.2, S(760, 520)], [4.2, S(360, 100)], // to new mail row
    [5.0, S(360, 100)], [5.8, S(200, 340)],                   // to CTA
    [7.2, S(200, 340)], [8.0, S(500, 440)],                   // to Zaloguj
    [17.6, S(680, 420)], [18.4, S(850, 28)], [21, S(850, 28)], // to report
  ];
  const clicks = [4.5, 6.3, 8.4, 18.7];
  function cursorAt(t) {
    for (let i = 0; i < path.length - 1; i++) {
      const [a, pa] = path[i], [b, pb] = path[i + 1];
      if (t <= b) { const k = ease(clamp((t - a) / (b - a || 1))); return [lerp(pa[0], pb[0], k), lerp(pa[1], pb[1], k)]; }
    }
    return path[path.length - 1][1];
  }

  // highlight geometry from real text metrics (works with any loaded font)
  const HL = { dom: 262, pilne: 118, time: 186 };
  function layoutHL() {
    const m2 = $('mail2'), prev = m2.getAttribute('opacity'); m2.setAttribute('opacity', '1');
    for (const [k, hl, tag, line] of [['dom', 'hl-dom', 'tag-dom', 'l-dom'], ['pilne', 'hl-pilne', 'tag-pilne', 'l-pilne'], ['time', 'hl-time', 'tag-time', 'l-time']]) {
      const b = $('t-' + k).getBBox(), L = $(line).getBBox();
      const r = $(hl); r.setAttribute('x', (b.x - 4).toFixed(1)); r.setAttribute('y', (b.y - 2).toFixed(1)); r.setAttribute('height', (b.height + 4).toFixed(1));
      HL[k] = b.width + 8;
      const g = $(tag), tr = g.querySelector('rect'), tt = g.querySelector('text');
      const w = Number(tr.getAttribute('width')), x = Math.min(L.x + L.width + 18, 1000 - w - 16);
      tr.setAttribute('x', x.toFixed(1)); tr.setAttribute('y', (L.y + L.height / 2 - 17).toFixed(1));
      tt.setAttribute('x', (x + w / 2).toFixed(1)); tt.setAttribute('y', (L.y + L.height / 2 + 6).toFixed(1));
    }
    m2.setAttribute('opacity', prev);
  }
  layoutHL();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { layoutHL(); render(tp); });

  function render(t) {
    // captions
    op('cap1', win(t, 0.6, 5.6));
    op('cap2', win(t, 5.8, 9.4));
    op('cap3', win(t, 9.6, 13.6));
    op('cap4', win(t, 13.8, 16.0));
    op('cap5', win(t, 16.2, 21.4));

    // inbox → mail1 → login
    const row = seg(t, 1.0, 1.6);
    op('newrow', row);
    $('newrow').setAttribute('transform', `translate(0 ${lerp(-86, 0, out(row)).toFixed(1)})`);
    $('oldrows').setAttribute('transform', `translate(0 ${lerp(-86, 0, out(row)).toFixed(1)})`);
    $('clock').textContent = t < 5.4 ? '8:47' : '8:58';
    op('mail1', seg(t, 4.6, 5.0) * (1 - seg(t, 6.4, 6.7)));
    op('login', seg(t, 6.4, 6.7) * (1 - seg(t, 8.6, 9.0)));
    const typed = Math.floor(clamp((t - 6.9) / 1.0) * 10);
    $('pw').textContent = '•'.repeat(typed);

    // phone
    const up = seg(t, 8.8, 9.6), down = seg(t, 13.4, 14.0);
    $('phone').setAttribute('transform', `translate(1040 ${lerp(1200, 430, up) + lerp(0, 800, down)})`);
    $('phclock').textContent = t < 10.6 ? '9:06' : '9:12';
    op('sms', seg(t, 9.6, 10.0));
    op('notif', seg(t, 10.8, 11.1));
    const shake = t > 10.8 && t < 11.6 ? Math.sin(t * 60) * 6 * (1 - (t - 10.8) / .8) : 0;
    $('laptop').setAttribute('transform', `translate(${shake.toFixed(1)} 0)`);
    op('alarm', 0.18 * win(t, 10.9, 13.4, .3));

    // rewind
    const rw = win(t, 13.6, 15.2, .25);
    op('rewind', rw);
    if (t > 13.6 && t < 15.2) {
      const k = clamp((t - 13.8) / 1.1);
      const mins = Math.round(lerp(9 * 60 + 12, 8 * 60 + 47, ease(k)));
      $('rwclock').textContent = `${Math.floor(mins / 60)}:${String(mins % 60).padStart(2, '0')}`;
      $('scan').setAttribute('transform', `translate(0 ${(t * 400) % 8})`);
    }

    // analysed mail
    op('mail2', seg(t, 14.9, 15.2) * (1 - seg(t, 21.2, 21.6)));
    $('hl-dom').setAttribute('width', (seg(t, 15.6, 16.1) * HL.dom).toFixed(1));
    $('hl-pilne').setAttribute('width', (seg(t, 16.4, 16.9) * HL.pilne).toFixed(1));
    $('hl-time').setAttribute('width', (seg(t, 17.1, 17.6) * HL.time).toFixed(1));
    op('tag-dom', seg(t, 16.0, 16.3));
    op('tag-pilne', seg(t, 16.8, 17.1));
    op('tag-time', seg(t, 17.5, 17.8));
    op('toast', seg(t, 18.9, 19.2));
    $('report').querySelector('rect').setAttribute('fill', t > 18.7 ? '#EEEBFF' : '#FFFFFF');
    $('toast').setAttribute('transform', `translate(0 ${lerp(20, 0, out(seg(t, 18.9, 19.3))).toFixed(1)})`);

    // cursor
    const cvis = Math.max(win(t, 3.0, 9.0, .3), win(t, 17.4, 21.0, .3));
    op('cursor', cvis);
    const [cx, cy] = cursorAt(t);
    $('cursor').setAttribute('transform', `translate(${cx.toFixed(1)} ${cy.toFixed(1)})`);
    let rp = 0, rr = 0;
    for (const c of clicks) if (t >= c && t < c + .5) { const k = (t - c) / .5; rp = .35 * (1 - k); rr = 12 + 34 * out(k); }
    $('ripple').setAttribute('r', rr.toFixed(1)); op('ripple', rp);

    // outro
    const o = seg(t, 21.6, 22.2);
    op('outro', o);
    const w = out(seg(t, 21.9, 22.6));
    $('word').setAttribute('transform', `translate(0 ${lerp(30, 0, w).toFixed(1)})`);
    op('word', w);
    const dp = seg(t, 22.5, 22.8);
    $('dot').setAttribute('dy', (lerp(-40, 0, out(dp))).toFixed(1));
    op('dot', dp);
    op('tag', seg(t, 23.0, 23.5));
    op('url', seg(t, 23.5, 24.0));
    // fade to loop
    const fade = seg(t, 25.4, 26);
    $('film').style.opacity = String(1 - fade * 0.999);
  }

  // playback
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const record = new URLSearchParams(location.search).has('record');
  if (record) document.body.classList.add('record');
  let playing = !reduce && !record, t0 = performance.now();
  tp = reduce ? 24 : 0;
  function frame(now) {
    if (playing) tp = ((now - t0) / 1000) % T;
    render(tp);
    $('prog').style.width = (tp / T * 100).toFixed(2) + '%';
    $('time').textContent = `${tp.toFixed(1).replace('.', ',')} / 26,0 s`;
    if (!record) requestAnimationFrame(frame);
  }
  $('play').textContent = playing ? 'Pauza' : 'Odtwórz';
  $('play').addEventListener('click', () => {
    playing = !playing;
    if (playing) t0 = performance.now() - tp * 1000;
    $('play').textContent = playing ? 'Pauza' : 'Odtwórz';
    $('play').setAttribute('aria-label', playing ? 'Pauza' : 'Odtwórz');
  });
  $('again').addEventListener('click', () => { tp = 0; t0 = performance.now(); if (!playing) render(0); });
  window.__render = t => { tp = t; render(t); };
  window.__duration = T;
  render(tp);
  if (!record) requestAnimationFrame(frame);
})();
</script>
